{% extends 'base.html' %}

{% block content %}
<style>
    .reset-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(at 100% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
            radial-gradient(at 0% 100%, hsla(225, 39%, 30%, 1) 0, transparent 50%);
    }

    .glass-card {
        background: rgba(15, 23, 42, 0.75);
        /* Darker Background for Contrast */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .modern-input {
        width: 100%;
        padding: 1rem 1rem 1rem 3rem;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: #fff;
    }

    .input-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
    }
</style>

<div class="reset-bg"></div>

<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card glass-card border-0 rounded-4 w-100 p-4 p-md-5" style="max-width: 500px;">
        <div class="text-center mb-4">
            <div
                class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 rounded-circle p-3 mb-3">
                <i class="fas fa-key fa-2x text-danger"></i>
            </div>
            <h3 class="fw-bold text-white font-outfit">Reset Password Baru</h3>
            <p class="text-white-50">Silakan buat password baru untuk akun Anda.</p>
        </div>

        <form action="{{ url_for('reset_password', token=token) }}" method="POST">
            <div class="position-relative mb-4">
                <input type="password" class="modern-input" id="password" name="password" placeholder="Password Baru"
                    required minlength="6">
                <i class="fas fa-lock input-icon"></i>
            </div>

            <button type="submit" class="btn btn-danger w-100 py-3 rounded-3 fw-bold shadow-lg">
                <i class="fas fa-save me-2"></i> Simpan Password Baru
            </button>
        </form>
    </div>
</div>
{% endblock %}
