{% extends 'base.html' %}

{% block content %}
<style>
    /* ANIMATED MESH GRADIENT Keren (Shared with Login) */
    .login-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
            radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
            radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
        background-size: 200% 200%;
        animation: meshFlow 15s ease infinite;
    }

    @keyframes meshFlow {
        0% {
            background-position: 0% 50%;
        }

        50% {
            background-position: 100% 50%;
        }

        100% {
            background-position: 0% 50%;
        }
    }

    /* Particles / Stars */
    .particles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 50px 50px;
        opacity: 0.1;
    }

    /* GLASSMORPHISM CARD */
    .glass-card {
        background: rgba(255, 255, 255, 0.05);
        /* Slightly clearer */
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* MODERN INPUTS */
    .modern-input-group {
        position: relative;
        margin-bottom: 1.25rem;
    }

    .modern-input {
        width: 100%;
        padding: 0.8rem 0.8rem 0.8rem 2.8rem;
        background: rgba(0, 0, 0, 0.4);
        /* Lebih gelap agar teks putih lebih jelas */
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        color: #fff;
        font-size: 0.95rem;
        transition: all 0.3s ease;
    }

    .modern-input::placeholder {
        color: rgba(255, 255, 255, 0.5);
        /* Placeholder lebih terang */
    }

    .modern-input:focus {
        background: rgba(0, 0, 0, 0.6);
        border-color: var(--bs-primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
        outline: none;
    }

    .modern-select {
        appearance: none;
        background-image: url("data:image/svg+xml,...");
    }

    /* Simplified for brevity, will rely on standard */

    .input-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.7);
        /* Icon lebih terang */
        transition: color 0.3s;
        font-size: 0.9rem;
    }

    .modern-input:focus+.input-icon {
        color: var(--bs-primary);
    }

    .section-title {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: rgba(255, 255, 255, 0.8);
        /* Judul section lebih jelas */
        font-weight: 700;
        margin-bottom: 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        padding-bottom: 0.5rem;
    }

    /* LEFT SIDE MASKOT AREA */
    .mascot-area {
        background: radial-gradient(circle at center, rgba(99, 102, 241, 0.25), transparent 70%);
        border-right: 1px solid rgba(255, 255, 255, 0.1);
    }
</style>

<div class="login-bg"></div>
<div class="particles"></div>

<div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="card glass-card border-0 rounded-4 w-100 overflow-hidden shadow-lg" style="max-width: 1100px;">
        <div class="row g-0">
            <!-- LEFT: 3D MASCOT -->
            <div
                class="col-lg-5 d-none d-lg-flex flex-column align-items-center justify-content-center mascot-area position-relative p-5">
                <div class="text-center z-2 mb-4">
                    <h2 class="fw-bold text-white mb-2" style="font-family: 'Outfit', sans-serif;">Join the Movement
                    </h2>
                    <p class="text-white opacity-75">Create an account to start your Web3 donation journey.</p>
                </div>
                <div class="mascot-container w-100" style="height: 350px;">
                    <canvas id="register-mascot-canvas" style="width: 100%; height: 100%;"></canvas>
                </div>
            </div>

            <!-- RIGHT: REGISTER FORM -->
            <div class="col-lg-7 position-relative">
                <div class="card-body p-4 p-md-5 h-100 d-flex flex-column justify-content-center"
                    style="background: rgba(15, 23, 42, 0.85);"> <!-- Background Form Lebih Gelap -->

                    <div class="mb-4">
                        <h3 class="fw-bold text-white font-outfit">Create Account</h3>
                        <p class="text-white opacity-75 small">Fill in your details to get started.</p>
                        <div class="position-absolute top-0 end-0 p-4">
                            <a href="{{ url_for('index') }}"
                                class="text-white opacity-50 hover-opacity-100 transition-all" title="Back to Home"><i
                                    class="fas fa-times fa-lg"></i></a>
                        </div>
                    </div>

                    <form action="{{ url_for('register') }}" method="POST">

                        <!-- PROFILE DATA -->
                        <div class="section-title">1. Profile Information</div>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <div class="modern-input-group">
                                    <input type="text" class="modern-input" id="username" name="username"
                                        placeholder="Username" required>
                                    <i class="fas fa-user input-icon"></i>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="modern-input-group">
                                    <select class="modern-input form-select text-white" id="role" name="role" required
                                        style="padding-left: 2.8rem; background-color: rgba(15, 23, 42, 0.6); border-color: rgba(255,255,255,0.1);">
                                        <option value="donatur" class="text-dark">💙 Donator</option>
                                        <option value="kreator" class="text-dark">📢 Campaign Creator</option>
                                    </select>
                                    <i class="fas fa-user-tag input-icon"></i>
                                </div>
                            </div>
                        </div>

                        <div class="modern-input-group">
                            <input type="email" class="modern-input" id="email" name="email"
                                placeholder="Email Address (@gmail.com only)" required>
                            <i class="fas fa-envelope input-icon"></i>
                        </div>
                        <div class="modern-input-group">
                            <input type="password" class="modern-input" id="password" name="password"
                                placeholder="Create Password" required>
                            <i class="fas fa-lock input-icon"></i>
                        </div>

                        <!-- BLOCKCHAIN DATA -->
                        <div class="section-title mt-4">2. Blockchain Connection</div>

                        <div class="modern-input-group">
                            <select class="modern-input form-select font-monospace text-white" id="wallet_address"
                                name="wallet_address" required
                                style="padding-left: 2.8rem; background-color: rgba(15, 23, 42, 0.6); border-color: rgba(255,255,255,0.1);">
                                <option value="" disabled selected class="text-dark">-- Select Ganache Wallet --
                                </option>
                                {% for acc in accounts %}
                                <option value="{{ acc }}" class="text-dark">{{ acc }}</option>
                                {% else %}
                                <option value="" disabled class="text-dark">No accounts detected (Check Connection)
                                </option>
                                {% endfor %}
                            </select>
                            <i class="fas fa-wallet input-icon"></i>
                        </div>

                        <div class="modern-input-group">
                            <input type="password" class="modern-input font-monospace" id="private_key"
                                name="private_key" placeholder="Paste Private Key" required>
                            <i class="fas fa-key input-icon"></i>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input bg-dark border-secondary" type="checkbox" value=""
                                id="flexCheckDefault" required>
                            <label class="form-check-label small text-secondary" for="flexCheckDefault">
                                I verify that this is my private key and authorize this session.
                            </label>
                        </div>

                        <button type="submit"
                            class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-lg position-relative overflow-hidden group">
                            Complete Setup <i class="fas fa-check-circle ms-2"></i>
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-secondary small mb-0">Already have an account? <a href="{{ url_for('login') }}"
                                class="text-white fw-bold text-decoration-none">Sign In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- SCRIPTS 3D (Identik dengan Login.html agar bentuk maskot sama) -->
<script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    function initMascot() {
        const canvas = document.getElementById('register-mascot-canvas');
        const container = document.querySelector('.mascot-container');

        if (!canvas || !container) return;

        const scene = new THREE.Scene();
        scene.background = null;

        // KAMERA: Disamakan dengan Login (Z=5.8) agar Zoom-nya pas
        const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 5.8;
        camera.position.y = 0;

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            alpha: true,
            antialias: true,
            premultipliedAlpha: false
        });

        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.setClearColor(0x000000, 0);

        // --- MODELING (Sama Persis dengan Login) ---
        const mascotGroup = new THREE.Group();
        scene.add(mascotGroup);

        const furColor = new THREE.Color(0xFF8800);
        const creamColor = new THREE.Color(0xFFFDD0);
        const noseColor = new THREE.Color(0x222222);

        const mainFurMat = new THREE.MeshStandardMaterial({ color: furColor, roughness: 0.5 });
        const creamFurMat = new THREE.MeshStandardMaterial({ color: creamColor, roughness: 0.6 });
        const noseMat = new THREE.MeshStandardMaterial({ color: noseColor, roughness: 0.3 });

        // HEAD
        const head = new THREE.Mesh(new THREE.SphereGeometry(1.0, 32, 32), mainFurMat);
        head.scale.set(1.1, 0.95, 1.0); mascotGroup.add(head);

        // SNOUT
        const snout = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 32), creamFurMat);
        snout.position.set(0, -0.3, 0.85); snout.scale.set(1, 0.8, 1.2); head.add(snout);

        // CHEEKS
        const cheekGeo = new THREE.SphereGeometry(0.45, 32, 32);
        const cheekL = new THREE.Mesh(cheekGeo, creamFurMat);
        cheekL.position.set(-0.6, -0.35, 0.5); cheekL.scale.set(1, 0.8, 0.8); head.add(cheekL);
        const cheekR = new THREE.Mesh(cheekGeo, creamFurMat);
        cheekR.position.set(0.6, -0.35, 0.5); cheekR.scale.set(1, 0.8, 0.8); head.add(cheekR);

        // NOSE
        const nose = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), noseMat);
        nose.position.set(0, 0.1, 0.45); nose.scale.set(1.5, 1, 1); snout.add(nose);

        // EARS
        const earGeo = new THREE.ConeGeometry(0.35, 0.9, 32);
        const earInnerGeo = new THREE.ConeGeometry(0.2, 0.6, 32);
        const earL = new THREE.Mesh(earGeo, mainFurMat);
        earL.position.set(-0.6, 0.85, 0); earL.rotation.z = 0.3; earL.rotation.x = -0.1; head.add(earL);
        const earLInner = new THREE.Mesh(earInnerGeo, creamFurMat);
        earLInner.position.set(0, -0.1, 0.18); earL.add(earLInner);
        const earR = new THREE.Mesh(earGeo, mainFurMat);
        earR.position.set(0.6, 0.85, 0); earR.rotation.z = -0.3; earR.rotation.x = -0.1; head.add(earR);
        const earRInner = new THREE.Mesh(earInnerGeo, creamFurMat);
        earRInner.position.set(0, -0.1, 0.18); earR.add(earRInner);

        // EYES
        const eyeWhiteGeo = new THREE.SphereGeometry(0.28, 32, 32);
        const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.1 });
        const pupilGeo = new THREE.SphereGeometry(0.12, 16, 16);
        const pupilMat = new THREE.MeshBasicMaterial({ color: 0x111111 });

        const eyeL = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
        eyeL.position.set(-0.35, 0.05, 0.82); eyeL.scale.set(1, 1.1, 0.5); head.add(eyeL);
        const pupilL = new THREE.Mesh(pupilGeo, pupilMat);
        pupilL.position.z = 0.25; eyeL.add(pupilL);

        const eyeR = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
        eyeR.position.set(0.35, 0.05, 0.82); eyeR.scale.set(1, 1.1, 0.5); head.add(eyeR);
        const pupilR = new THREE.Mesh(pupilGeo, pupilMat);
        pupilR.position.z = 0.25; eyeR.add(pupilR);

        // BROWS
        const browGeo = new THREE.CapsuleGeometry(0.05, 0.3, 4, 8);
        const browMat = new THREE.MeshStandardMaterial({ color: furColor });
        const browL = new THREE.Mesh(browGeo, browMat);
        browL.rotation.z = Math.PI / 2 + 0.2; browL.position.set(-0.35, 0.4, 0.85); head.add(browL);
        const browR = new THREE.Mesh(browGeo, browMat);
        browR.rotation.z = Math.PI / 2 - 0.2; browR.position.set(0.35, 0.4, 0.85); head.add(browR);

        // LIGHTING
        const ambientLight = new THREE.HemisphereLight(0xffffff, 0xffeedd, 0.5); scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2); mainLight.position.set(5, 10, 7); scene.add(mainLight);
        const rimLight = new THREE.DirectionalLight(0x4f46e5, 1.5); // Rim light
        rimLight.position.set(-5, 5, -5); scene.add(rimLight);

        // MOUSE INTERACTION
        let mouseX = 0; let mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            const windowHalfX = window.innerWidth / 2;
            const windowHalfY = window.innerHeight / 2;
            mouseX = (event.clientX - windowHalfX) / windowHalfX;
            mouseY = (event.clientY - windowHalfY) / windowHalfY;
        });

        // RESIZE
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });

        // ANIMATE
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            const pupilLimit = 0.15;
            const targetPupilX = Math.max(-pupilLimit, Math.min(pupilLimit, mouseX * 0.3));
            const targetPupilY = Math.max(-pupilLimit, Math.min(pupilLimit, -mouseY * 0.3));

            pupilL.position.x = THREE.MathUtils.lerp(pupilL.position.x, targetPupilX, 0.15);
            pupilL.position.y = THREE.MathUtils.lerp(pupilL.position.y, targetPupilY, 0.15);
            pupilR.position.x = THREE.MathUtils.lerp(pupilR.position.x, targetPupilX, 0.15);
            pupilR.position.y = THREE.MathUtils.lerp(pupilR.position.y, targetPupilY, 0.15);

            const targetHeadRotX = -mouseY * 0.25;
            const targetHeadRotY = mouseX * 0.35;
            mascotGroup.rotation.x = THREE.MathUtils.lerp(mascotGroup.rotation.x, targetHeadRotX, 0.08);
            mascotGroup.rotation.y = THREE.MathUtils.lerp(mascotGroup.rotation.y, targetHeadRotY, 0.08);

            mascotGroup.position.y = Math.sin(time * 1.5) * 0.1;
            earL.rotation.z = 0.3 + Math.sin(time * 3) * 0.05;
            earR.rotation.z = -0.3 - Math.cos(time * 2.5) * 0.05;

            renderer.render(scene, camera);
        }
        animate();
    }

    if (document.readyState === 'complete') initMascot();
    else window.addEventListener('load', initMascot);
</script>
{% endblock %}
