{% extends 'base.html' %}

{% block content %}
<style>
    /* Gradient Background (Same as Login) */
    .forgot-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
            radial-gradient(at 100% 100%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
        background-size: 200% 200%;
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .modern-input {
        width: 100%;
        padding: 1rem 1rem 1rem 3rem;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: #fff;
    }

    .input-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
    }
</style>

<div class="forgot-bg"></div>

<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card glass-card border-0 rounded-4 w-100 p-4 p-md-5" style="max-width: 500px;">
        <div class="text-center mb-4">
            <div
                class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 rounded-circle p-3 mb-3">
                <i class="fas fa-lock-open fa-2x text-warning"></i>
            </div>
            <h3 class="fw-bold text-white font-outfit">Lupa Password?</h3>
            <p class="text-white-50">Masukkan email Anda untuk menerima link reset password.</p>
        </div>

        <form action="{{ url_for('forgot_password') }}" method="POST">
            <div class="position-relative mb-4">
                <input type="email" class="modern-input" id="email" name="email" placeholder="name@example.com"
                    required>
                <i class="fas fa-envelope input-icon"></i>
            </div>

            <button type="submit" class="btn btn-warning w-100 py-3 rounded-3 fw-bold shadow-lg text-dark">
                Kirim Link Reset <i class="fas fa-paper-plane ms-2"></i>
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('login') }}" class="text-white-50 text-decoration-none hover-text-white">
                <i class="fas fa-arrow-left me-1"></i> Kembali ke Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
